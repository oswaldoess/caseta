openapi: 3.0.3
info:
  title: Caseta API
  version: 1.0.0-borrador
  description: >-
    API pública de Caseta, sistema de control de visitas para fraccionamientos privados. Todas las peticiones entran por
    el API Gateway. Borrador de la Entrega 3 del proyecto integrador de Arquitectura Orientada a Servicios (UPSRJ).
servers:
  - url: http://localhost:3000/api/v1
    description: API Gateway en el entorno local
tags:
  - name: Identidad
    description: 'S1: sesiones, usuarios y contraseñas.'
  - name: Viviendas
    description: 'S2: viviendas y asignación de residentes.'
  - name: Visitas
    description: 'S3: visitas y códigos de acceso.'
  - name: Accesos
    description: 'S4: validación de códigos, entradas, salidas e historial.'
  - name: Reglas y Adeudos
    description: 'S5: adeudos y parámetros del reglamento.'
  - name: Sistema
    description: Estado del sistema.
security:
  - bearerAuth: []
paths:
  /sesiones:
    post:
      tags:
        - Identidad
      operationId: e01
      summary: Iniciar sesión
      description: Crea una sesión con correo y contraseña y devuelve un token JWT válido por 8 horas.
      x-endpoint: E01
      x-roles: Público
      x-requisitos: RF01
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SesionCrear'
            example:
              correo: carlos.ramirez@correo.com
              contrasena: Fresnos2026!
      responses:
        '201':
          description: Sesión creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjUyLCJyb2wiOiJyZXNpZGVudGUiLCJqdGkiOiI3YzFlIn0.Qm8...
                tipo: Bearer
                expiraEn: 28800
                usuario:
                  id: 52
                  nombreCompleto: Carlos Ramírez Soto
                  rol: residente
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          description: Correo o contraseña incorrectos, o cuenta desactivada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: CREDENCIALES_INVALIDAS
                  mensaje: El correo o la contraseña no son correctos.
                  estado: 401
                  detalles: []
                  ruta: /api/v1/sesiones
                  fecha: '2026-10-21T16:40:12-06:00'
                  idSolicitud: req_8f3a2c1d
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /sesiones/actual:
    delete:
      tags:
        - Identidad
      operationId: e02
      summary: Cerrar sesión
      description: Revoca el token con el que se hace la petición. A partir de ese momento el token responde 401.
      x-endpoint: E02
      x-roles: Todos
      x-requisitos: RF02
      responses:
        '204':
          description: Operación realizada; sin contenido.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/me:
    get:
      tags:
        - Identidad
      operationId: e03
      summary: Consultar mi perfil
      description: Devuelve los datos del usuario dueño del token.
      x-endpoint: E03
      x-roles: Todos
      x-requisitos: RF01
      responses:
        '200':
          description: Perfil del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                id: 52
                nombreCompleto: Carlos Ramírez Soto
                correo: carlos.ramirez@correo.com
                telefono: '4425550101'
                rol: residente
                activo: true
                creadoEn: '2026-10-05T10:12:00-06:00'
                actualizadoEn: '2026-10-05T10:12:00-06:00'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/me/contrasena:
    put:
      tags:
        - Identidad
      operationId: e04
      summary: Cambiar mi contraseña
      description: Reemplaza la contraseña del usuario. Requiere la contraseña actual.
      x-endpoint: E04
      x-roles: Todos
      x-requisitos: RF03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioContrasena'
            example:
              contrasenaActual: Fresnos2026!
              contrasenaNueva: NuevaClave#2026
      responses:
        '204':
          description: Operación realizada; sin contenido.
        '400':
          description: La contraseña actual no coincide o la nueva es muy corta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: CONTRASENA_ACTUAL_INCORRECTA
                  mensaje: La contraseña actual no es correcta.
                  estado: 400
                  detalles: []
                  ruta: /api/v1/usuarios/me/contrasena
                  fecha: '2026-10-21T16:40:12-06:00'
                  idSolicitud: req_8f3a2c1d
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios:
    get:
      tags:
        - Identidad
      operationId: e05
      summary: Listar usuarios
      description: Lista paginada de usuarios con filtros.
      x-endpoint: E05
      x-roles: Administrador
      x-requisitos: RF04
      parameters:
        - name: rol
          in: query
          required: false
          description: Filtra por rol.
          schema:
            type: string
            enum:
              - residente
              - guardia
              - administrador
        - name: activo
          in: query
          required: false
          description: Filtra por estado de la cuenta.
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          description: Busca por nombre o correo.
          schema:
            type: string
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Lista de usuarios.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Usuario'
                  paginacion:
                    $ref: '#/components/schemas/Paginacion'
              example:
                datos:
                  - id: 52
                    nombreCompleto: Carlos Ramírez Soto
                    correo: carlos.ramirez@correo.com
                    telefono: '4425550101'
                    rol: residente
                    activo: true
                    creadoEn: '2026-10-05T10:12:00-06:00'
                    actualizadoEn: '2026-10-05T10:12:00-06:00'
                paginacion:
                  pagina: 1
                  limite: 20
                  total: 1
                  totalPaginas: 1
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags:
        - Identidad
      operationId: e06
      summary: Crear usuario
      description: Crea una cuenta. No existe autorregistro (RN01).
      x-endpoint: E06
      x-roles: Administrador
      x-requisitos: RF04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCrear'
            example:
              nombreCompleto: Carlos Ramírez Soto
              correo: carlos.ramirez@correo.com
              telefono: '4425550101'
              rol: residente
              contrasenaInicial: Temporal2026!
      responses:
        '201':
          description: Usuario creado. El encabezado Location indica su URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                id: 52
                nombreCompleto: Carlos Ramírez Soto
                correo: carlos.ramirez@correo.com
                telefono: '4425550101'
                rol: residente
                activo: true
                creadoEn: '2026-10-05T10:12:00-06:00'
                actualizadoEn: '2026-10-05T10:12:00-06:00'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          description: Ya existe una cuenta con ese correo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: CORREO_DUPLICADO
                  mensaje: Ya existe una cuenta registrada con el correo carlos.ramirez@correo.com.
                  estado: 409
                  detalles: []
                  ruta: /api/v1/usuarios
                  fecha: '2026-10-21T16:40:12-06:00'
                  idSolicitud: req_8f3a2c1d
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/{usuarioId}:
    parameters:
      - $ref: '#/components/parameters/usuarioId'
    get:
      tags:
        - Identidad
      operationId: e07
      summary: Consultar usuario
      description: Devuelve un usuario por su identificador.
      x-endpoint: E07
      x-roles: Administrador
      x-requisitos: RF04
      responses:
        '200':
          description: Usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                id: 52
                nombreCompleto: Carlos Ramírez Soto
                correo: carlos.ramirez@correo.com
                telefono: '4425550101'
                rol: residente
                activo: true
                creadoEn: '2026-10-05T10:12:00-06:00'
                actualizadoEn: '2026-10-05T10:12:00-06:00'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      tags:
        - Identidad
      operationId: e08
      summary: Actualizar o desactivar usuario
      description: >-
        Modifica datos de la cuenta. Enviar activo: false la desactiva (baja lógica): el historial se conserva, pero el
        usuario ya no puede iniciar sesión.
      x-endpoint: E08
      x-roles: Administrador
      x-requisitos: RF04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioActualizar'
            example:
              activo: false
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                id: 52
                nombreCompleto: Carlos Ramírez Soto
                correo: carlos.ramirez@correo.com
                telefono: '4425550101'
                rol: residente
                activo: false
                creadoEn: '2026-10-05T10:12:00-06:00'
                actualizadoEn: '2026-10-21T16:40:12-06:00'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /viviendas:
    get:
      tags:
        - Viviendas
      operationId: e09
      summary: Listar viviendas
      description: Lista paginada de viviendas.
      x-endpoint: E09
      x-roles: Administrador
      x-requisitos: RF05
      parameters:
        - name: q
          in: query
          required: false
          description: Busca por calle o número.
          schema:
            type: string
        - name: activa
          in: query
          required: false
          description: Filtra por estado.
          schema:
            type: boolean
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Lista de viviendas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vivienda'
                  paginacion:
                    $ref: '#/components/schemas/Paginacion'
              example:
                datos:
                  - id: 14
                    calle: Av. de los Fresnos
                    numero: '214'
                    referencia: Manzana 3, lote 8
                    domicilio: Av. de los Fresnos 214
                    activa: true
                    totalResidentes: 2
                    creadaEn: '2026-10-05T09:40:00-06:00'
                    actualizadaEn: '2026-10-05T09:40:00-06:00'
                paginacion:
                  pagina: 1
                  limite: 20
                  total: 1
                  totalPaginas: 1
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags:
        - Viviendas
      operationId: e10
      summary: Registrar vivienda
      description: Da de alta una vivienda. Calle y número no pueden repetirse.
      x-endpoint: E10
      x-roles: Administrador
      x-requisitos: RF05
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViviendaCrear'
            example:
              calle: Av. de los Fresnos
              numero: '214'
              referencia: Manzana 3, lote 8
      responses:
        '201':
          description: Vivienda creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vivienda'
              example:
                id: 14
                calle: Av. de los Fresnos
                numero: '214'
                referencia: Manzana 3, lote 8
                domicilio: Av. de los Fresnos 214
                activa: true
                totalResidentes: 0
                creadaEn: '2026-10-05T09:40:00-06:00'
                actualizadaEn: '2026-10-05T09:40:00-06:00'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          description: Ya existe una vivienda con esa calle y número.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: VIVIENDA_DUPLICADA
                  mensaje: Ya existe la vivienda Av. de los Fresnos 214.
                  estado: 409
                  detalles: []
                  ruta: /api/v1/viviendas
                  fecha: '2026-10-21T16:40:12-06:00'
                  idSolicitud: req_8f3a2c1d
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /viviendas/{viviendaId}:
    parameters:
      - $ref: '#/components/parameters/viviendaId'
    get:
      tags:
        - Viviendas
      operationId: e11
      summary: Consultar vivienda
      description: Devuelve una vivienda. El residente solo puede consultar la suya.
      x-endpoint: E11
      x-roles: Administrador; residente (solo la suya)
      x-requisitos: RF05
      responses:
        '200':
          description: Vivienda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vivienda'
              example:
                id: 14
                calle: Av. de los Fresnos
                numero: '214'
                referencia: Manzana 3, lote 8
                domicilio: Av. de los Fresnos 214
                activa: true
                totalResidentes: 2
                creadaEn: '2026-10-05T09:40:00-06:00'
                actualizadaEn: '2026-10-05T09:40:00-06:00'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      tags:
        - Viviendas
      operationId: e12
      summary: Actualizar o desactivar vivienda
      description: 'Modifica datos de la vivienda. activa: false la desactiva.'
      x-endpoint: E12
      x-roles: Administrador
      x-requisitos: RF05
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViviendaActualizar'
            example:
              referencia: Manzana 3, lote 8, casa esquina
      responses:
        '200':
          description: Vivienda actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vivienda'
              example:
                id: 14
                calle: Av. de los Fresnos
                numero: '214'
                referencia: Manzana 3, lote 8, casa esquina
                domicilio: Av. de los Fresnos 214
                activa: true
                totalResidentes: 2
                creadaEn: '2026-10-05T09:40:00-06:00'
                actualizadaEn: '2026-10-05T09:40:00-06:00'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /viviendas/{viviendaId}/residentes:
    parameters:
      - $ref: '#/components/parameters/viviendaId'
    get:
      tags:
        - Viviendas
      operationId: e13
      summary: Listar residentes de una vivienda
      description: Residentes asignados a la vivienda.
      x-endpoint: E13
      x-roles: Administrador
      x-requisitos: RF06
      responses:
        '200':
          description: Residentes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asignacion'
              example:
                datos:
                  - usuarioId: 52
                    nombreCompleto: Carlos Ramírez Soto
                    esTitular: true
                    fechaAlta: '2026-10-05'
                  - usuarioId: 53
                    nombreCompleto: Ana Torres Lugo
                    esTitular: false
                    fechaAlta: '2026-10-05'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags:
        - Viviendas
      operationId: e14
      summary: Asignar residente
      description: Asigna un usuario con rol residente a la vivienda (RN02).
      x-endpoint: E14
      x-roles: Administrador
      x-requisitos: RF06
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignacionCrear'
            example:
              usuarioId: 52
              esTitular: true
      responses:
        '201':
          description: Residente asignado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asignacion'
              example:
                usuarioId: 52
                nombreCompleto: Carlos Ramírez Soto
                esTitular: true
                fechaAlta: '2026-10-21'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El residente ya está asignado a otra vivienda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: RESIDENTE_YA_ASIGNADO
                  mensaje: El usuario 52 ya está asignado a la vivienda Av. de los Fresnos 210.
                  estado: 409
                  detalles: []
                  ruta: /api/v1/viviendas/14/residentes
                  fecha: '2026-10-21T16:40:12-06:00'
                  idSolicitud: req_8f3a2c1d
        '422':
          description: El usuario no existe, está inactivo o no tiene rol de residente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: REFERENCIA_INVALIDA
                  mensaje: El usuario 7 no tiene rol de residente.
                  estado: 422
                  detalles:
                    - campo: usuarioId
                      mensaje: Debe ser un usuario activo con rol residente.
                  ruta: /api/v1/viviendas/14/residentes
                  fecha: '2026-10-21T16:40:12-06:00'
                  idSolicitud: req_8f3a2c1d
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
  /viviendas/{viviendaId}/residentes/{usuarioId}:
    parameters:
      - $ref: '#/components/parameters/viviendaId'
      - $ref: '#/components/parameters/usuarioId'
    delete:
      tags:
        - Viviendas
      operationId: e15
      summary: Retirar residente
      description: Quita la asignación del residente a la vivienda.
      x-endpoint: E15
      x-roles: Administrador
      x-requisitos: RF06
      responses:
        '204':
          description: Operación realizada; sin contenido.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /visitas:
    get:
      tags:
        - Visitas
      operationId: e16
      summary: Listar visitas
      description: 'Residente: visitas de su vivienda. Guardia: solo las válidas hoy. Administrador: todas.'
      x-endpoint: E16
      x-roles: Residente; guardia (solo hoy); administrador
      x-requisitos: RF10, RF15
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtra por estado.
          schema:
            type: string
            enum:
              - activa
              - cancelada
              - utilizada
              - vencida
        - name: tipo
          in: query
          required: false
          description: Filtra por tipo.
          schema:
            type: string
            enum:
              - unica
              - frecuente
              - no_programada
        - name: validaEn
          in: query
          required: false
          description: Solo visitas válidas en esa fecha. Para el guardia siempre es hoy.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/desde'
        - $ref: '#/components/parameters/hasta'
        - name: q
          in: query
          required: false
          description: Busca por nombre del visitante o domicilio.
          schema:
            type: string
        - name: viviendaId
          in: query
