components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token obtenido en POST /sesiones. Se envía como Authorization: Bearer <token>.'
  parameters:
    pagina:
      name: pagina
      in: query
      required: false
      description: Número de página (desde 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    limite:
      name: limite
      in: query
      required: false
      description: Elementos por página (1 a 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    usuarioId:
      name: usuarioId
      in: path
      required: true
      description: Identificador del usuario.
      schema:
        type: integer
        minimum: 1
    viviendaId:
      name: viviendaId
      in: path
      required: true
      description: Identificador de la vivienda.
      schema:
        type: integer
        minimum: 1
    visitaId:
      name: visitaId
      in: path
      required: true
      description: Identificador de la visita.
      schema:
        type: integer
        minimum: 1
    accesoId:
      name: accesoId
      in: path
      required: true
      description: Identificador del registro de acceso.
      schema:
        type: integer
        minimum: 1
    adeudoId:
      name: adeudoId
      in: path
      required: true
      description: Identificador del adeudo.
      schema:
        type: integer
        minimum: 1
    clave:
      name: clave
      in: path
      required: true
      description: Clave del parámetro.
      schema:
        type: string
        enum:
          - limite_personas_con_adeudo
          - tolerancia_minutos
    codigo:
      name: codigo
      in: path
      required: true
      description: Código de acceso de 8 caracteres.
      schema:
        type: string
        pattern: ^[A-HJ-NP-Z2-9]{8}$
    desde:
      name: desde
      in: query
      required: false
      description: Fecha inicial (AAAA-MM-DD).
      schema:
        type: string
        format: date
    hasta:
      name: hasta
      in: query
      required: false
      description: Fecha final (AAAA-MM-DD).
      schema:
        type: string
        format: date
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - codigo
            - mensaje
            - estado
            - detalles
            - ruta
            - fecha
            - idSolicitud
          properties:
            codigo:
              type: string
              description: Código del error en mayúsculas; el consumidor lo usa para decidir qué hacer.
              example: VALIDACION_FALLIDA
            mensaje:
              type: string
              description: Mensaje en español para mostrar a la persona.
            estado:
              type: integer
              description: Código de estado HTTP de la respuesta.
            detalles:
              type: array
              description: Errores por campo; vacío si no aplica.
              items:
                $ref: '#/components/schemas/DetalleError'
            ruta:
              type: string
              description: Ruta que se solicitó.
            fecha:
              type: string
              description: Fecha y hora del error (ISO 8601, UTC−6).
              format: date-time
            idSolicitud:
              type: string
              description: Identificador de la solicitud para rastrearla en los registros.
    DetalleError:
      type: object
      required:
        - campo
        - mensaje
      properties:
        campo:
          type: string
          description: Nombre del campo con error.
        mensaje:
          type: string
          description: Qué está mal y cómo corregirlo.
    Paginacion:
      type: object
      required:
        - pagina
        - limite
        - total
        - totalPaginas
      properties:
        pagina:
          type: integer
          description: Página actual.
        limite:
          type: integer
          description: Elementos por página.
        total:
          type: integer
          description: Total de elementos.
        totalPaginas:
          type: integer
          description: Total de páginas.
    SesionCrear:
      type: object
      required:
        - correo
        - contrasena
      properties:
        correo:
          type: string
          description: Correo del usuario.
          format: email
        contrasena:
          type: string
          description: Contraseña.
          format: password
          minLength: 8
    Sesion:
      type: object
      required:
        - token
        - tipo
        - expiraEn
        - usuario
      properties:
        token:
          type: string
          description: Token JWT que se envía en el encabezado Authorization.
        tipo:
          type: string
          description: Tipo de token.
          enum:
            - Bearer
        expiraEn:
          type: integer
          description: Segundos de vigencia (8 horas).
        usuario:
          $ref: '#/components/schemas/UsuarioResumen'
    UsuarioResumen:
