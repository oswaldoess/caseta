          type: string
          description: Nombre.
        placas:
          type: string
          description: Placas.
          nullable: true
        numeroPersonas:
          type: integer
          description: Personas.
          minimum: 1
          maximum: 20
        fecha:
          type: string
          description: Solo visitas únicas.
          format: date
        fechaFin:
          type: string
          description: Solo frecuentes.
          format: date
        horaInicio:
          type: string
          description: HH:mm
        horaFin:
          type: string
          description: HH:mm
        diasSemana:
          type: array
          items:
            type: string
            enum:
              - lunes
              - martes
              - miercoles
              - jueves
              - viernes
              - sabado
              - domingo
    Validez:
      type: object
      properties:
        codigo:
          type: string
          description: Código consultado.
        valido:
          type: boolean
          description: Si permite la entrada en este momento.
        motivo:
          type: string
          description: Motivo si no es válido.
          enum:
            - cancelado
            - vencido
            - aun_no_vigente
            - dia_no_permitido
            - fuera_de_horario
            - ya_utilizado
            - ya_dentro
            - null
          nullable: true
        mensaje:
          type: string
          description: Explicación para el guardia.
        visita:
          type: object
          properties:
            id:
              type: integer
              description: Visita.
            tipo:
              type: string
              description: Tipo.
            nombreVisitante:
              type: string
              description: Visitante.
            numeroPersonas:
              type: integer
              description: Personas.
            domicilio:
              type: string
              description: Domicilio.
            horaInicio:
              type: string
              description: HH:mm
            horaFin:
              type: string
              description: HH:mm
        consultadoEn:
          type: string
          description: Momento de la consulta.
          format: date-time
    AccesoConCodigo:
      type: object
      required:
        - codigo
      properties:
        codigo:
          type: string
          description: Código de 8 caracteres.
          pattern: ^[A-HJ-NP-Z2-9]{8}$
        observaciones:
          type: string
          description: Observación opcional.
          maxLength: 250
    AccesoNoProgramado:
      type: object
      required:
        - visitaNoProgramada
      properties:
        visitaNoProgramada:
          type: object
          required:
            - viviendaId
            - nombreVisitante
            - numeroPersonas
            - autorizadoPor
          properties:
            viviendaId:
              type: integer
              description: Vivienda a la que va.
            nombreVisitante:
              type: string
              description: Nombre del visitante.
            placas:
              type: string
              description: Placas (opcional).
            numeroPersonas:
              type: integer
              description: Personas.
              minimum: 1
              maximum: 20
            autorizadoPor:
              type: string
              description: Residente que autorizó por teléfono.
        observaciones:
          type: string
          description: Observación opcional.
          maxLength: 250
    Acceso:
      type: object
      properties:
        id:
          type: integer
          description: Identificador.
        visitaId:
          type: integer
          description: Visita.
        tipoVisita:
          type: string
          description: Copia del tipo de visita.
        nombreVisitante:
          type: string
          description: Copia del nombre.
        numeroPersonas:
          type: integer
          description: Copia del número de personas.
        viviendaId:
          type: integer
          description: Vivienda.
        domicilio:
          type: string
          description: Copia del domicilio.
        residenteId:
          type: integer
          description: Residente de la visita.
          nullable: true
        entrada:
          type: string
          description: Fecha y hora de entrada.
          format: date-time
        guardiaEntradaId:
          type: integer
          description: Guardia que registró la entrada.
        salida:
          type: string
          description: Fecha y hora de salida.
          format: date-time
          nullable: true
        guardiaSalidaId:
          type: integer
          description: Guardia que registró la salida.
          nullable: true
        observaciones:
          type: string
          description: Observaciones.
          nullable: true
    SalidaCrear:
      type: object
      properties:
        observaciones:
          type: string
          description: Observación opcional.
          maxLength: 250
    AccesoActualizar:
      type: object
      required:
        - observaciones
      properties:
        observaciones:
          type: string
          description: Observación que se agrega al registro.
          maxLength: 250
    Adeudo:
      type: object
      properties:
        id:
          type: integer
          description: Identificador.
        viviendaId:
          type: integer
          description: Vivienda.
        concepto:
          type: string
          description: Concepto.
        periodo:
          type: string
          description: Periodo (AAAA-MM).
        monto:
          type: number
          format: double
          description: Monto en pesos.
        estado:
          type: string
          description: Estado.
          enum:
            - pendiente
            - liquidado
        registradoEn:
          type: string
          description: Alta.
          format: date-time
        liquidadoEn:
          type: string
          description: Liquidación.
          format: date-time
          nullable: true
    AdeudoCrear:
      type: object
      required:
        - viviendaId
        - concepto
        - periodo
        - monto
      properties:
        viviendaId:
          type: integer
          description: Vivienda.
        concepto:
          type: string
          description: Concepto.
          maxLength: 80
        periodo:
          type: string
          description: AAAA-MM
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        monto:
          type: number
          minimum: 0.01
          description: Monto en pesos.
    AdeudoActualizar:
      type: object
      required:
        - estado
      properties:
        estado:
          type: string
          description: Solo se permite liquidado.
          enum:
            - liquidado
    Parametro:
      type: object
      properties:
        clave:
          type: string
          description: Clave única.
        valor:
          type: integer
          description: Valor actual.
        descripcion:
          type: string
          description: Descripción.
        minimo:
          type: integer
          description: Valor mínimo permitido.
        maximo:
          type: integer
          description: Valor máximo permitido.
        actualizadoEn:
          type: string
          description: Última modificación.
          format: date-time
    ParametroActualizar:
      type: object
      required:
        - valor
      properties:
        valor:
          type: integer
          description: Nuevo valor dentro del rango.
    EstadoSistema:
      type: object
      properties:
        estado:
          type: string
          description: ok si todos los servicios responden; degradado si alguno falla.
          enum:
            - ok
            - degradado
        version:
          type: string
          description: Versión de la API.
        fecha:
          type: string
          description: Momento de la revisión.
          format: date-time
        servicios:
          type: object
          additionalProperties:
            type: string
            enum:
              - ok
              - sin_respuesta
  responses:
    SolicitudInvalida:
      description: Datos con formato o valores no válidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: VALIDACION_FALLIDA
              mensaje: Algunos campos no son válidos.
              estado: 400
              detalles:
                - campo: horaFin
                  mensaje: Debe ser posterior a horaInicio.
              ruta: /api/v1/visitas
              fecha: '2026-10-21T16:40:12-06:00'
              idSolicitud: req_8f3a2c1d
    NoAutenticado:
      description: Falta el token, es inválido, expiró o fue revocado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: TOKEN_INVALIDO
              mensaje: Tu sesión no es válida o expiró. Inicia sesión de nuevo.
              estado: 401
              detalles: []
              ruta: /api/v1/visitas
              fecha: '2026-10-21T16:40:12-06:00'
              idSolicitud: req_8f3a2c1d
    SinPermiso:
      description: El rol del usuario no permite esta operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: SIN_PERMISO
              mensaje: Tu rol no tiene permiso para realizar esta operación.
              estado: 403
              detalles: []
              ruta: /api/v1/adeudos
              fecha: '2026-10-21T16:40:12-06:00'
              idSolicitud: req_8f3a2c1d
    NoEncontrado:
      description: El recurso no existe o no pertenece al usuario.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: RECURSO_NO_ENCONTRADO
              mensaje: La visita solicitada no existe.
              estado: 404
              detalles: []
              ruta: /api/v1/visitas/9999
              fecha: '2026-10-21T16:40:12-06:00'
              idSolicitud: req_8f3a2c1d
    Conflicto:
      description: La operación choca con el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: CONFLICTO
              mensaje: La operación no se puede realizar en el estado actual del recurso.
              estado: 409
              detalles: []
              ruta: /api/v1/accesos/9031/salida
              fecha: '2026-10-21T16:40:12-06:00'
              idSolicitud: req_8f3a2c1d
    ReglaDeNegocio:
      description: Los datos son válidos, pero no cumplen una regla de negocio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: LIMITE_PERSONAS_EXCEDIDO
              mensaje: La vivienda tiene un adeudo pendiente y solo puede recibir 10 personas por día. Ya hay 8 registradas.
              estado: 422
              detalles: []
              ruta: /api/v1/visitas
              fecha: '2026-10-21T16:40:12-06:00'
              idSolicitud: req_8f3a2c1d
    DemasiadosIntentos:
      description: Se superó el límite de peticiones.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: DEMASIADOS_INTENTOS
              mensaje: Demasiados intentos de inicio de sesión. Espera un minuto e inténtalo de nuevo.
              estado: 429
              detalles: []
              ruta: /api/v1/sesiones
              fecha: '2026-10-21T16:40:12-06:00'
              idSolicitud: req_8f3a2c1d
    ErrorInterno:
      description: Error no previsto en el servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERROR_INTERNO
              mensaje: Ocurrió un error inesperado. Inténtalo más tarde.
              estado: 500
              detalles: []
              ruta: /api/v1/visitas
              fecha: '2026-10-21T16:40:12-06:00'
              idSolicitud: req_8f3a2c1d
    ServicioNoDisponible:
      description: Un servicio necesario no respondió a tiempo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: SERVICIO_NO_DISPONIBLE
              mensaje: No fue posible validar las reglas del fraccionamiento. Inténtalo en unos momentos.
              estado: 503
              detalles: []
              ruta: /api/v1/visitas
              fecha: '2026-10-21T16:40:12-06:00'
              idSolicitud: req_8f3a2c1d
